version: '2.2'

volumes:
  orderer3.gmp.com:
  peer4.hospital.com:
  peer5.hospital.com:
  peer4.patient.com:
  peer5.patient.com:

networks:
  fabric_network:
    name: medical_network

services:
  # order service nodes
  orderer3.gmp.com:
    container_name: orderer3.gmp.com
    image: hyperledger/fabric-orderer:2.4.2
    environment:
      - GODEBUG=netdns=go
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/etc/hyperledger/config/genesis.block # inject genesis block
      - ORDERER_GENERAL_LOCALMSPID=GMPMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/etc/hyperledger/orderer/msp # about certificate
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/etc/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/etc/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/etc/hyperledger/orderer/tls/ca.crt]
    command: orderer
    ports:
      - "7050:7050"
    volumes: # mount certificate files generated by "cryptogen" and "configtxgen"
      - ./config/genesis.block:/etc/hyperledger/config/genesis.block
      - ./crypto-config/ordererOrganizations/gmp.com/orderers/orderer3.gmp.com/:/etc/hyperledger/orderer
      - orderer3.gmp.com:/var/hyperledger/production/orderer
    networks:
      - fabric_network

  #  hospital organization——peer4 node
  peer4.hospital.com:
    extends:
      file: docker-compose-base.yaml
      service: peer-base
    container_name: peer4.hospital.com
    environment:
      - CORE_PEER_ID=peer4.hospital.com
      - CORE_PEER_LOCALMSPID=HospitalMSP
      - CORE_PEER_ADDRESS=peer4.hospital.com:7051
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/peer/tls/ca.crt
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer4.hospital.com:7051
    ports:
      - "7051:7051" # grpc service port
      - "7053:7053" # eventhub port
    volumes:
      - ./crypto-config/peerOrganizations/hospital.com/peers/peer4.hospital.com:/etc/hyperledger/peer
      - peer4.hospital.com:/var/hyperledger/production
    depends_on:
      - orderer3.gmp.com
      - couchdb0

  #  hospital organization——peer5 node
  peer5.hospital.com:
    extends:
      file: docker-compose-base.yaml
      service: peer-base
    container_name: peer5.hospital.com
    environment:
      - CORE_PEER_ID=peer5.hospital.com
      - CORE_PEER_LOCALMSPID=HospitalMSP
      - CORE_PEER_ADDRESS=peer5.hospital.com:7051
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/peer/tls/ca.crt
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer5.hospital.com:7051
    ports:
      - "17051:7051"
      - "17053:7053"
    volumes:
      - ./crypto-config/peerOrganizations/hospital.com/peers/peer5.hospital.com:/etc/hyperledger/peer
      - peer5.hospital.com:/var/hyperledger/production
    depends_on:
      - orderer3.gmp.com
      - couchdb0

  #  patient organization——peer4 node
  peer4.patient.com:
    extends:
      file: docker-compose-base.yaml
      service: peer-base
    container_name: peer4.patient.com
    environment:
      - CORE_PEER_ID=peer4.patient.com
      - CORE_PEER_LOCALMSPID=PatientMSP
      - CORE_PEER_ADDRESS=peer4.patient.com:7051
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/peer/tls/ca.crt
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer4.patient.com:7051
    ports:
      - "27051:7051"
      - "27053:7053"
    volumes:
      - ./crypto-config/peerOrganizations/patient.com/peers/peer4.patient.com:/etc/hyperledger/peer
      - peer4.patient.com:/var/hyperledger/production
    depends_on:
      - orderer3.gmp.com
      - couchdb0

  #  patient organization——peer5 node
  peer5.patient.com:
    extends:
      file: docker-compose-base.yaml
      service: peer-base
    container_name: peer5.patient.com
    environment:
      - CORE_PEER_ID=peer5.patient.com
      - CORE_PEER_LOCALMSPID=PatientMSP
      - CORE_PEER_ADDRESS=peer5.patient.com:7051
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/peer/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/peer/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/peer/tls/ca.crt
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer5.patient.com:7051
    ports:
      - "37051:7051"
      - "37053:7053"
    volumes:
      - ./crypto-config/peerOrganizations/patient.com/peers/peer5.patient.com:/etc/hyperledger/peer
      - peer5.patient.com:/var/hyperledger/production
    depends_on:
      - orderer3.gmp.com
      - couchdb0